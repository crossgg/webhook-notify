version: '3.8'

services:
  webhook-notify:
    # 如需本地构建可保留 build，直接使用官方多架构镜像可直接拉取
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: ghcr.io/crossgg/webhook-notify:latest
    container_name: webhook-notify
    restart: unless-stopped
    ports:
      - "5755:5755"
    environment:
      # 可选：API-Key 鉴权（配置后调用接口必须传入匹配的 api-key）
      - API_KEY=your_secret_api_key

      # 可选：是否启用一言（true/false）
      - HITOKOTO=false

      # 渠道配置示例（环境变量优先级高于 config.json，填哪几个就启用哪几个）
      # - BARK_PUSH=https://api.day.app/your_token/
      # - QYWX_KEY=your_wecom_bot_key
      # - FSKEY=your_feishu_key
      # - FSSECRET=your_feishu_secret
      # - DD_BOT_TOKEN=your_dingtalk_token
      # - DD_BOT_SECRET=your_dingtalk_secret
      # - TG_BOT_TOKEN=123456:ABC-DEF
      # - TG_USER_ID=123456789
    volumes:
      # 支持将本地的 config.json 挂载进容器（若配置了同名环境变量，环境变量优先）
      - ./config.json:/app/config.json:ro
